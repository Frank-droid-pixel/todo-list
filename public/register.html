<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMaster Pro — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span class="brand-name">TaskMaster Pro</span>
      </div>

      <div class="auth-header">
        <h1>Create account</h1>
        <p>Start managing your tasks today</p>
      </div>

      <div id="error-msg" class="alert alert-error hidden"></div>
      <div id="success-msg" class="alert alert-success hidden"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="name" name="name" placeholder="John Doe" required autocomplete="name" />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉</span>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password <small>(min. 6 characters)</small></label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required />
            <button type="button" class="toggle-password" id="togglePass">👁</button>
          </div>
          <div class="password-strength" id="strengthBar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required />
          </div>
        </div>

        <button type="submit" class="btn-primary" id="registerBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader hidden">◌</span>
        </button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    </div>

    <div class="auth-features">
      <div class="feature-item"><span>✓</span> Free to use, always</div>
      <div class="feature-item"><span>✓</span> Secure password hashing</div>
      <div class="feature-item"><span>✓</span> Session-based authentication</div>
      <div class="feature-item"><span>✓</span> Your data stays private</div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    // Password strength checker
    document.getElementById('password').addEventListener('input', function () {
      const val = this.value;
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const pct = (strength / 5) * 100;
      fill.style.width = pct + '%';
      fill.style.background = pct < 40 ? '#ef4444' : pct < 70 ? '#f59e0b' : '#22c55e';
      label.textContent = pct < 40 ? 'Weak' : pct < 70 ? 'Fair' : pct < 90 ? 'Strong' : 'Very Strong';
      label.style.color = fill.style.background;
    });

    document.getElementById('togglePass').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        return showAlert('error', 'Passwords do not match');
      }
      await handleAuth('/api/auth/register', {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password
      }, 'registerBtn');
    });
  </script>
</body>
</html>
